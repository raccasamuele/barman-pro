name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# La CI verde e' precondizione per promuovere in produzione, quindi esiste
# fin dal primo commit — non alla fine, quando sarebbe inutile.
#
# I controlli entrano in modalita' informativa e diventano bloccanti nella
# fase prevista dal piano (i18n: Fase 6 · residui: Fase 8). Un gate che
# fallisce sempre viene ignorato, e allora non protegge piu' niente.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Installa il browser
        run: npx playwright install --with-deps chromium

      - name: Golden · motore di calcolo e database
        run: npx playwright test --project=golden

      - name: UI · interazioni reali
        run: npx playwright test --project=ui

      - name: PWA · precache e aggiornamento
        run: npx playwright test --project=pwa

      - name: Traduzioni
        run: npm run check:i18n -- --strict

      - name: Residui del prodotto commerciale
        run: npm run check:forbidden -- --strict

      - name: Salva i report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
