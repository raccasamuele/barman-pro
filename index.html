<!DOCTYPE html>
<!--
    Segnaposto di reindirizzamento.

    Qui, fino ad agosto 2026, viveva la vecchia landing commerciale di Barman
    PRO su GitHub Pages. Il progetto e' poi diventato open source e si e'
    spostato su Cloudflare; Pages e' stato spento e questo indirizzo ha
    iniziato a rispondere "Site not found", pur restando nell'indice dei
    motori di ricerca con il vecchio testo a pagamento.

    Questa pagina esiste per trasformare quel 404 in un rimando: chi arriva da
    un vecchio link finisce sull'app, e il canonical dice ai motori qual e'
    l'indirizzo buono. Volutamente NON c'e' un meta robots "noindex": con
    quello i motori butterebbero via la pagina senza mai leggere il canonical,
    e il vecchio indirizzo non verrebbe consolidato sul nuovo.

    Non c'e' altro in questo branch, e non ci deve essere: il sito vero sta
    sul branch main, in public/, e viene servito da Cloudflare.
-->

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barman PRO &middot; il sito si e' spostato</title>

    padding: 24px;
  }

  h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 .75rem; }

</style>
</head>

</main>

</html>
